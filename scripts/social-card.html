<!-- Anteprima del link: l'immagine che si vede quando mandi l'indirizzo
     dell'app su WhatsApp, Telegram o in un messaggio.

     Per rigenerare public/social.png basta aprire questo file in un browser e
     catturarlo a 1200x630 (in Chrome: F12, icona del telefono, dimensione
     personalizzata 1200x630, menu dei tre puntini -> Capture screenshot).
     Il disegno usa gli stessi colori dell'app, così l'anteprima e la pagina
     si somigliano. -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #050b16; color: #e8eef7;
    font-family: Inter, system-ui, sans-serif; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(circle at 85% 15%, rgba(52,211,153,.16), transparent 55%);
  }
  .marchio { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .marchio .sigla { color: #34d399; font-family: "JetBrains Mono", monospace; }
  h1 { font-size: 76px; line-height: 1.05; letter-spacing: -2px; max-width: 900px; }
  h1 em { color: #34d399; font-style: normal; }
  p { font-size: 28px; color: #8ea0b8; max-width: 820px; margin-top: 24px; line-height: 1.4; }
  .voci { display: flex; gap: 14px; flex-wrap: wrap; }
  .voce {
    border: 1px solid #17253c; background: #0b1524; border-radius: 999px;
    padding: 12px 22px; font-size: 24px; color: #8ea0b8;
  }
</style></head><body>
  <div class="marchio"><span class="sigla">FC27</span><span>Trader</span></div>
  <div>
    <h1>Compra e vendi su <em>EA FC 27</em> senza tirare a indovinare.</h1>
    <p>Margini al netto della tassa, momento giusto della settimana, prezzo stimato e verdetti sulla rosa.</p>
  </div>
  <div class="voci">
    <span class="voce">Occasioni</span>
    <span class="voce">Prezzi</span>
    <span class="voce">Calcoli</span>
    <span class="voce">Conti</span>
    <span class="voce">Si installa sul telefono</span>
  </div>
</body></html>
