# Pubblica la versione statica dell'app su GitHub Pages a ogni push su main.
#
# Attenzione: Pages serve solo file statici, quindi il proxy dati non esiste.
# Su Pages l'app funziona con il dataset demo incluso; per i prezzi veri di
# Futbin serve il proxy avviato in locale ("npm run mobile").

name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prepara Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Con un dominio personalizzato il sito sta nella radice; senza, dentro
      # /<nome-repo>/. Lo decide la presenza del file public/CNAME, così per
      # passare a un dominio proprio basta aggiungere quel file.
      - name: Calcola la base del sito
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "Dominio personalizzato: $(cat public/CNAME)"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
